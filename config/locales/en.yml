# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   "true": "foo"
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  errors:
    internal: "Something went wrong. Please try again."
    encryption:
      empty_body: "Request body cannot be empty"
      parameter_missing: "Missing parameter or its value: original_string"
      unknown_cipher: "Unknown cipher: %{name}"
    translation:
      blank_title: "Please provide a Wikipedia article title"
      fetch_failed: "Could not retrieve that Wikipedia article. Check the title and try again."
  wiki:
    title: "Wikipedia to Pig Latin"
    subtitle: "Fetches an article from Wikipedia and renders it side by side with its Pig Latin translation."
    search_label: "Wikipedia article title"
    search_placeholder: "Pig Latin"
    search_button: "Translate"
    original_heading: "Original"
    translated_heading: "Pig Latin"
    empty_prompt: "Enter an article title above to see it translated."
    paragraph_count:
      one: "1 paragraph"
      other: "%{count} paragraphs"
